<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Job Application Portal</title>
</head>
<body>
    <fieldset>
        <legend>4. Technical Skill and Experience </legend>

        <label><b>Yours of  Experience :</b></label>
        <input type="number" style="width: 100px;" placeholder="0" ><br><br>
        <label ><b> Preferrd Technology :</b></label>
        <input type="text"><br><br>
        <label><b>Technical Skill:</b></label> 
        <select size="5">
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Java">Java</option>
            <option value="Python">Python</option>
            <option value="C++">C++</option>
        </select><br>
        <p> Use Ctrl (Windows) or Command (Mac) to Select Multiple Skills. </p>
        <label><b>Upload Resume(PDF Form):</b></label>
        <input type="file"><br><br>
        <label><b> Upload Certification :</b></label>
        <input type="file"><br><br>
        <label><b>Why Should we Hire You?</b></label><br>
        <textarea  rows="5" cols="50" placeholder="Description your Skills and strengths"  ></textarea><br>
        
    </fieldset>
</body>
</html>
