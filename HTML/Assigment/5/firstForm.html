<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Job Application Portal</title>
</head>
<body>
    <p>Apply for your dream job ! </p>
    <fieldset>
    <legend>1.Personal Information </legend><br>
    <label> <b>Full Name :</b></label>
    <input type="text" placeholder="Enter your full name "><br><br>
    <label><b>Create Password:</b></label>
    <input type="password" placeholder="Enter Password"><br><br>
    <label><b>Email Addresss :</b></label>
    <input type="email" placeholder="example@gmail.com"><br><br>
    <label><b>Phone Number :</b></label>
    <input type="tel" placeholder="10 Digit mobile Number"><br><br>
    <label><b>Age :</b></label>
    <input type="number"><br><br>
    <label><b> Date of Birth :</b></label>
    <input type="date"><br><br>
    <label ><b>Gender :</b></label>
    <input type="radio">Male
    <input type="radio">Female
    <input type="radio">Other<br><br>
    <label><b>Current Address:</b></label><br>
    <textarea placeholder="Enter your Address"></textarea><br><br>
    <label ><b>Profile Photograph:</b></label>
    <input type="file"><br><br>
    <label ><b>Portfolio Website:</b></label>
    <input type="url" placeholder="https://example.com">
    
    
    </fieldset>
</body>
</html>
