<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Job Application Portal</title>
</head>
<body>
    <fieldset>
        <legend >3.job prefererance</legend>
        <label><b>Search Job Role:</b></label>
        <input type="text" placeholder="Search Job Position"><br><br>
        <label><b>Select Job Role:</b></label>
        <select>
            <option value="--Select Job Role--">--Select Job Role--</option>
            <option  value="FrontEnd Devloper">FrontEnd Devloper</option>
            <option value="BackEnd Devloper">BackEndDevloper</option>
            <option value="FullStack Devloper"> FullStack Devloper </option>
        </select><br><br>
        <label><b>Employment Type:</b></label><br><br>
        <input type="radio">Full Time
        <input type="radio">Part Time
        <input type="radio">Internship<br><br>
        <label><b>Expected Monthly Salary(INR):</b></label>
        <input type="number"><br><br>
        <label><b>Prferred Interview Time:</b></label>
        <input type="time"><br><br>
        <label><b>Preferred Theme Color:</b></label>
        <input type="color"><br><br>
        <label><b>Coding Confidence(0-10):</b></label>
        <input type="range"><br><br>
        <label><b>LinkedIn Profile:</b></label>
        <input type="url" placeholder="https://LinkedIn.com/in/user">


    </fieldset>
</body>
</html>
